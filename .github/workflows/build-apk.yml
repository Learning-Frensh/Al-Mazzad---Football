name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football_auction
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create . --platforms=android --org com.mohamed

      - name: Bump Kotlin, AGP and Gradle versions
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          sed -i 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.1.4"/' android/settings.gradle
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-auction-apk
          path: football_auction/build/app/outputs/flutter-apk/app-release.apk
